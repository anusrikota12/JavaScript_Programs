<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            table {
                border-collapse: collapse;
                width: 70%;
            }
            th, td{
                border: 1px solid rgb(32, 26, 205);
                padding: 10px;
                text-align: center;
            }
            th{
                background-color: rgb(166, 170, 218);
            }
        </style>
    </head>
    <body>
        <h1>Student Details</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>John Doe</td>
                    <td>Java</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Jane Smith</td>
                    <td>Python</td>
                    <td>92</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Mike Johnson</td>
                    <td>Web Development</td>
                    <td>78</td>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Average</td>
                    <td>85</td>
                </tr>
            </tfoot>
        </table>
    </body>
