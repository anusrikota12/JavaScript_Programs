<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HTML Lists</title>
    </head>
    <body>
        <h1>Programming Languages</h1>

        <h2>Unordered List</h2>
        <ul>
            <li>Java</li>
            <li>Python</li>
            <li>JavaScript</li>
            <li>C++</li>
        </ul>
        <h2>Ordered List</h2>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
        </ol>
        <h2>Description List</h2>
        <dl>
            <dt>HTML:</dt>
            <dd>Used to structure web pages.</dd>

            <dt>CSS:</dt>
            <dd>Used to style web pages.</dd>

            <dt>JavaScript:</dt>
            <dd>Used to add behavior to web pages.</dd>
        </dl>
</html>
