<!DOCTYPE html>
<html lang="en">
<head>
    
</head>
<body>
   <h1>Registration</h1> 
   <form>
        <label>Name:</label>
        <input
            type="text"
            name="name"
            required
            minlength="3"
            maxlength="30">
        <br></br>
        <label>Email:</label>
        <input  
            type="email"
            name="email"
            required>
        <br></br>
        <label>Age:</label>
        <input
            type="number"
            name="age"
            min="18"
            max="60"
            required>
        <br></br>
        <label>Password:</label>
        <input
            type="password"
            name="password"
            required
            minlength="8">
        <br></br>
        <label>Phone Number:</label>
        <input
            type="tel"
            name="phone"
            pattern="[0-9]{10}"
            required
            placeholder="10 digit number">
        <br></br>
        <button type="submit">
            Submit
        </button>
   </form>
</body>
</html>
