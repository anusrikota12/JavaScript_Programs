<!DOCTYPE html>
<html lang="en">
<head>
    <title>Colors</title>
    <link rel="stylesheet" href="colors.css">
</head>
<body>
    <h1>CSS Color Formats</h1>
    <div class="box1">
        <h2>Color Name:</h2>
        <p>This text uses the color name red.</p>
    </div>
    <div class="box2">
        <h2>HEX Color</h2>
        <p>This text uses #ff0000.</p>
    </div>
    <div color="box3">
        <h2>RGB Color</h2>
        <p>This text uses rgb(255,0,0).</p>
    </div>
    <div color="box4">
        <h2>RGBA Color</h2>
        <p>This text uses rgba(255,0,0,0.5)</p>
    </div>
</body>
</html>
